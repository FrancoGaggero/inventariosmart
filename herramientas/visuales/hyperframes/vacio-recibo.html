<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"trazo","type":"color","label":"Trazo","default":"#f0c07a"},
    {"id":"suave","type":"color","label":"Relleno suave","default":"rgba(224,165,74,0.18)"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=240, height=176" />
    <title>Estado vacío: recibo</title>
    <script src="vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="comun.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="vacio-recibo"
      data-start="0"
      data-width="240"
      data-height="176"
      data-duration="3"
    >
      <section id="vacio-recibo-escena" class="clip" data-start="0" data-duration="3">
        <!-- Mismos trazos que EstadoVacio.tsx ('recibo'). Las líneas se escriben y se borran. -->
        <svg viewBox="0 0 120 88" fill="none" aria-hidden="true">
          <ellipse class="s" cx="60" cy="80" rx="36" ry="5" />
          <g id="papel">
            <path class="s t" d="M38 10h44v62l-7-5-7 5-8-5-8 5-7-5-7 5V10Z" />
            <path id="l1" class="t" d="M48 26h24" />
            <path id="l2" class="t" d="M48 38h24" />
            <path id="l3" class="t" d="M48 50h14" />
          </g>
        </svg>
      </section>
    </div>
    <script>
      // El cuadro final (líneas escritas) es el mismo que el inicial: el loop las borra y las vuelve a escribir.
      const tl = gsap.timeline({ paused: true });
      tl.set('#l1, #l2', { strokeDasharray: 24 })
        .set('#l3', { strokeDasharray: 14 })
        .to('#l3', { strokeDashoffset: 14, duration: 0.25, ease: 'power1.in' }, 0.3)
        .to('#l2', { strokeDashoffset: 24, duration: 0.25, ease: 'power1.in' }, 0.5)
        .to('#l1', { strokeDashoffset: 24, duration: 0.25, ease: 'power1.in' }, 0.7)
        .fromTo(
          '#papel',
          { y: 0 },
          { y: -2, duration: 0.5, yoyo: true, repeat: 1, ease: 'sine.inOut' },
          0.9,
        )
        .to('#l1', { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, 1.3)
        .to('#l2', { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, 1.65)
        .to('#l3', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, 2.0);
      window.__timelines['vacio-recibo'] = tl;
    </script>
  </body>
</html>

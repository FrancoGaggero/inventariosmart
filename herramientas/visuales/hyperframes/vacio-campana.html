<!doctype html>
<html

    <link rel="stylesheet" href="comun.css" />

  <body>
    <div
      id="root"
      data-composition-id="vacio-campana"
      data-start="0"
      data-width="240"
      data-height="176"
      data-duration="3"
    >
      <section id="vacio-campana-escena" class="clip" data-start="0" data-duration="3">
        <!-- Mismos trazos que EstadoVacio.tsx ('campana'). La campana oscila desde el gancho. -->
        <svg viewBox="0 -6 120 94" fill="none" aria-hidden="true">
          <ellipse class="s" cx="60" cy="78" rx="40" ry="6" />
          <g id="campana">
            <path class="s t" d="M40 60c0-18 4-34 20-34s20 16 20 34l6 6H34l6-6Z" />
            <path id="badajo" class="t" d="M52 70a8 8 0 0 0 16 0" />
            <circle class="punto" cx="60" cy="22" r="4" />
          </g>
          <path id="ondas-der" class="t" d="M84 30l6-4" />
          <path id="ondas-izq" class="t" d="M36 30l-6-4" />
          <path id="ondas-arr" class="t" d="M60 12V8" />
        </svg>
      </section>
    </div>
    <script>
      // Dos vaivenes que se apagan y una pausa; las ondas laten con el golpe.
      const tl = gsap.timeline({ paused: true });
      tl.set('#campana', { svgOrigin: '60 22' })
        .fromTo(
          '#campana',
          { rotation: 0 },
          { rotation: 14, duration: 0.25, ease: 'sine.out' },
          0.2,
        )
        .to('#campana', { rotation: -11, duration: 0.4, ease: 'sine.inOut' }, 0.45)
        .to('#campana', { rotation: 7, duration: 0.34, ease: 'sine.inOut' }, 0.86)
        .to('#campana', { rotation: -3, duration: 0.3, ease: 'sine.inOut' }, 1.2)
        .to('#campana', { rotation: 0, duration: 0.3, ease: 'sine.out' }, 1.5)
        .fromTo(
          '#ondas-der, #ondas-izq, #ondas-arr',
          { opacity: 1 },
          { opacity: 0.25, duration: 0.2, yoyo: true, repeat: 3, ease: 'sine.inOut' },
          0.3,
        )
        .fromTo(
          '#ondas-der',
          { x: 0 },
          { x: 2, duration: 0.2, yoyo: true, repeat: 3, ease: 'sine.inOut' },
          0.3,
        )
        .fromTo(
          '#ondas-izq',
          { x: 0 },
          { x: -2, duration: 0.2, yoyo: true, repeat: 3, ease: 'sine.inOut' },
          0.3,
        );
      window.__timelines['vacio-campana'] = tl;
    </script>

packages:
  - apps/*
  - packages/*

# pnpm 12: los scripts de instalación se habilitan de forma explícita por paquete.
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  protobufjs: true
  '@firebase/util': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  unrs-resolver: true

# Excepciones a la política de antigüedad mínima de versiones (pnpm las agregó al instalar).
minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
  - zod@4.6.1
  - '@firebase/ai@2.16.0'
  - '@firebase/analytics-compat@0.2.31'
  - '@firebase/analytics@0.10.25'
  - '@firebase/app-compat@0.5.18'
  - '@firebase/app@0.16.2'
  - '@firebase/auth-compat@0.6.11'
  - '@firebase/auth@1.13.6'
  - '@firebase/firestore-compat@0.4.14'
  - '@firebase/firestore@4.17.2'
  - '@firebase/messaging-compat@0.2.30'
  - '@firebase/messaging@0.13.3'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - firebase@12.19.0
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
